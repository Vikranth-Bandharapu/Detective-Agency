  <!-- SIGNUP FORM -->
  <section class="d-flex align-items-center bg-primary-dark" style="min-height: 100vh; padding-top: 80px; padding-bottom: 40px;">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6 col-md-10">
          <div class="bg-card p-5 border rounded" style="border-color: rgba(255,255,255,0.05) !important;" data-aos="fade-up">
            <div class="text-center mb-4">
              <img src="assets/logo.webp" alt="Stackly Logo" style="height: 60px;">
            </div>
            <form id="signupForm">
              <div class="row">
                <div class="col-md-6 mb-4">
                  <label class="form-label text-muted">First Name</label>
                  <input type="text" class="form-control bg-dark border-secondary text-white" placeholder="First Name" required>
                </div>
                <div class="col-md-6 mb-4">
                  <label class="form-label text-muted">Last Name</label>
                  <input type="text" class="form-control bg-dark border-secondary text-white" placeholder="Last Name" required>
                </div>
              </div>
              <div class="mb-4">
                <label class="form-label text-muted">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-dark border-secondary text-accent"><i class="fas fa-envelope"></i></span>
                  <input type="email" class="form-control bg-dark border-secondary text-white" placeholder="Enter email" required>
                </div>
              </div>
              <div class="mb-4">
                <label class="form-label text-muted">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-dark border-secondary text-accent"><i class="fas fa-lock"></i></span>
                  <input type="password" class="form-control bg-dark border-secondary text-white" placeholder="Create strong password" required>
                </div>
              </div>
              <div class="mb-4">
                <label class="form-label text-muted">Confirm Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-dark border-secondary text-accent"><i class="fas fa-check-double"></i></span>
                  <input type="password" class="form-control bg-dark border-secondary text-white" placeholder="Verify password" required>
                </div>
              </div>
              <button type="submit" class="btn btn-gold w-100 py-3 mb-3">Initialize Account</button>
              <p class="text-center text-muted small">Already have access? <a href="login.html" class="text-accent text-decoration-none">Login Here</a></p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>



  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script src="assets/main.js"></script>

  <script src="assets/validation.js"></script>
  <script src="assets/animations.js"></script>
