<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investigator Dashboard | Stackly</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/dashboard.css">
</head>
<body class="dashboard-body">

  <div class="dashboard-layout">
    <!-- SIDEBAR -->
    <aside class="dashboard-sidebar">
      <div class="sidebar-brand">
        <a href="index.html"><img src="assets/logo.webp" alt="Stackly"></a>
        <i class="fas fa-times sidebar-close-btn"></i>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="sidebar-link active"><i class="fas fa-home"></i> Dashboard</a>
        <a href="#" class="sidebar-link"><i class="fas fa-briefcase"></i> My Cases</a>
        <a href="#" class="sidebar-link"><i class="fas fa-tasks"></i> Assigned Investigations</a>
        <a href="#" class="sidebar-link"><i class="fas fa-video"></i> Surveillance</a>
        <a href="#" class="sidebar-link"><i class="fas fa-fingerprint"></i> Evidence</a>
        <a href="#" class="sidebar-link"><i class="fas fa-sticky-note"></i> Case Notes</a>
        <a href="#" class="sidebar-link"><i class="fas fa-file-alt"></i> Reports</a>
        <a href="#" class="sidebar-link"><i class="fas fa-comment-alt"></i> Messages</a>
        <a href="#" class="sidebar-link"><i class="fas fa-envelope"></i> Email Center</a>
        <a href="#" class="sidebar-link"><i class="fas fa-calendar-alt"></i> Calendar</a>
        <a href="#" class="sidebar-link"><i class="fas fa-user"></i> Profile</a>
        <a href="#" class="sidebar-link"><i class="fas fa-cog"></i> Settings</a>
      </nav>
      <div class="sidebar-footer">
        <a href="#" class="sidebar-link text-danger" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="dashboard-main">
      <header class="dashboard-header">
        <i class="fas fa-bars dashboard-toggle"></i>
        <div class="d-none d-md-block">
          <h5 class="mb-0 text-white">Investigator Terminal</h5>
        </div>
        <div class="user-profile-header">
          <span class="text-muted small d-none d-md-block" id="loggedEmailDisplay">agent@stackly.agency</span>
          <i class="fas fa-user-secret fa-2x text-accent"></i>
        </div>
      </header>

      <div class="dashboard-content" id="dynamicContentArea">
        <!-- Content loaded dynamically via JS -->
      </div>
    </main>
  </div>

  <div class="toast-container p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/validation.js"></script>
  <script src="assets/dashboard.js"></script>
</body>
</html>
